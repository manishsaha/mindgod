# MindGod configuration. Fee rates, edge thresholds, horizons, and risk
# limits are configuration, not code: they change over time and differ
# across markets.

polling:
  exchange_interval_s: 60
  # The Odds API bills per request (markets x regions), so sportsbooks refresh
  # on their own slower cadence. Discovery only feeds the review queue.
  sportsbook_interval_s: 300
  discovery_interval_s: 3600

pricing:
  devig_method: power  # additive | multiplicative | power (Shin: planned)
  # Floor on the fair-value standard error: one book measures zero
  # disagreement, which would drop the uncertainty penalty exactly when
  # uncertainty is highest.
  min_standard_error: 0.02
  # Quotes older than this never become fair values; quotes approaching the
  # gate widen the error bar by stale_se_per_minute per minute of age.
  max_quote_age_s: 900
  stale_se_per_minute: 0.001
  book_weights:
    pinnacle: 3.0
    circa: 3.0
    draftkings: 1.0
    fanduel: 1.0

engine:
  # Threshold applied to NET edge (gross edge minus per-contract taker fee
  # minus slippage), widened further by fair-value uncertainty. Never apply
  # a flat threshold to gross edge: the taker fee is price-dependent.
  min_net_edge: "0.02"
  kelly_fraction: "0.25"
  max_stake_per_bet: "100.0"
  max_exposure_per_event: "500.0"
  slippage: "0.005"
  # Stake shrink per unit of fair-value standard error: 1 / (1 + k * se).
  uncertainty_aversion: "10.0"
  # Edge-gate widening per unit of standard error: threshold + k * se.
  threshold_widening: "2.0"
  # Only positions settling within this horizon (principles section 7).
  horizon_days: 7
  # Suppress an opportunity when the exchange mid moved more than this
  # (probability) since the last sportsbook refresh: news reprices the
  # exchange in seconds while the consensus lags by minutes.
  max_kalshi_move: 0.03
  # Discovery only feeds the human review queue; restrict it to the series
  # we actually price.
  kalshi_discovery_series: ["KXNFLGAME", "KXMLBGAME"]

fees:
  # Kalshi's published form: ceil(rate * contracts * P * (1 - P)) per order.
  kalshi: {taker_rate: "0.07", maker_rate: "0.0"}
  # Polymarket's fee varies by market; 3% is an approximation. Verify per
  # market before production.
  polymarket: {taker_rate: "0.03", maker_rate: "0.0"}

alerts:
  cooldown_s: 900
  min_edge_move: "0.01"

execution:
  mode: dry-run  # dry-run | paper | live (live needs --live AND wiring)

# Registered markets. Explicit registration is the source of truth: tickers
# here are mapped onto canonical outcomes with the proposition builders.
# Event identity is league + teams + date + game_number (game_number tells
# MLB doubleheaders apart); `start` is required and compared in UTC. If the
# feed and the config disagree on the game number, the event ids stop
# matching, nothing trades, and the service logs the drift. Unregistered
# markets go to the review queue and are never traded.
listings:
  # - venue: kalshi
  #   market_id: KXNFLGAME-26OCT05KCBUF
  #   side: yes
  #   league: nfl
  #   home: KC
  #   away: BUF
  #   start: "2026-10-05T17:00:00Z"
  #   game_number: 1  # MLB doubleheaders only
  #   outcome_kind: moneyline   # moneyline | spread | total
  #   outcome_team: home        # home | away
  #   # handicap: "-3.5"        # for spread
  #   # total_line: "47.5"      # for total
  #   # total_side: over        # over | under
  #   refunds_on_tie: false
  #   # token_id: "..."        # Polymarket CLOB token id
