# MindGod weekend shadow config: NFL week 4, paper execution.
# All 15 week-4 games mapped to their Kalshi home-team moneylines
# (verified live with real orderbook depth on Fri Sep 25 2026).
# Execution is paper: alerts fire, fills are simulated, no real orders.

polling:
  exchange_interval_s: 60
  # 600s: the Odds API charges ~1 credit per poll with an explicit
  # bookmaker list and h2h only (the bookmakers parameter takes priority
  # over regions; the x-requests-last value on the first poll confirms
  # it). Fri 11pm -> Mon midnight is ~73h = ~438 credits at 600s, inside
  # a 500/month quota with headroom. If #ops shows used 2+ per poll,
  # raise this before Saturday night.
  sportsbook_interval_s: 600
  discovery_interval_s: 3600
  # Below 100 remaining credits: one loud #ops alert, and sportsbook
  # polls slow to every 30 min until the balance recovers.
  credit_reserve: 100
  credit_reserve_interval_s: 1800

pricing:
  devig_method: power
  min_standard_error: 0.02
  max_quote_age_s: 900
  stale_se_per_minute: 0.001
  # ADR-0011: NFL tie rate for the moneyline tie adjustment.
  nfl_tie_prob: 0.004
  nfl_tie_prob_se: 0.003
  # Weights apply only to books in ODDS_API_BOOKMAKERS; a weight for a
  # book not on the list (e.g. circa, unless added) is simply unused.
  book_weights:
    pinnacle: 3.0
    circa: 3.0
    draftkings: 1.0
    fanduel: 1.0

engine:
  min_net_edge: "0.02"
  kelly_fraction: "0.25"
  max_stake_per_bet: "100.0"
  max_exposure_per_event: "500.0"
  slippage: "0.005"
  uncertainty_aversion: "10.0"
  threshold_widening: "2.0"
  horizon_days: 7
  max_kalshi_move: 0.03
  move_check_max_spread: 0.06
  reaction_delay_s: 60
  kalshi_discovery_series: ["KXNFLGAME", "KXMLBGAME"]

fees:
  kalshi: {taker_rate: "0.07", maker_rate: "0.0"}
  polymarket: {taker_rate: "0.03", maker_rate: "0.0"}

alerts:
  cooldown_s: 900
  min_edge_move: "0.01"

execution:
  mode: paper  # shadow: paper fills only. live needs mode=live AND --live

